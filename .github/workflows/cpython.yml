name: Main Python with Sans

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        cc: [clang, gcc]
        os: [ubuntu-latest, macos-26, macos-26-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      # -fsanitize=memtag-stack -march=armv8a+memtag only with M5 CPU
      # CFLAGS: '-fsanitize-address-use-after-scope -fsanitize-coverage=trace-cmp -fstack-clash-protection'
      PYTHONSTRICTEXTENSIONBUILD: 1
      CC: ${{ matrix.cc }}
      SAN_LOG_OPTION: log_path=${{ github.workspace }}/san_log

    steps:
    - uses: actions/checkout@v6
      with:
        repository: "python/cpython"

#    - name: System info
#      run: |
#        $CC --version
#        system_profiler SPHardwareDataType

    - name: macOS-specific setup
      if:  ${{ contains(matrix.os, 'macos') }}
      run: |
        brew bundle --file=Misc/Brewfile
        brew install make llvm
        echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> "$GITHUB_ENV"
        echo LDFLAGS="-L/opt/homebrew/opt/llvm/lib" >> "$GITHUB_ENV"
        echo CPPFLAGS="-I/opt/homebrew/opt/llvm/include" >> "$GITHUB_ENV"
        alias make=gmake
        echo GDBM_CFLAGS="-I$(brew --prefix gdbm)/include" >> "$GITHUB_ENV"
        echo GDBM_LIBS="-L$(brew --prefix gdbm)/lib -lgdbm" >> "$GITHUB_ENV"
        echo TESTPYTHON=python.exe >> "$GITHUB_ENV"

    - name: apt update on arm64
      if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
      run: sudo apt update

    - name: Ubuntu-specific setup with LLVM
      if:  ${{ contains(matrix.os, 'ubuntu') && matrix.cc == 'clang'}}
      run: |
        sudo apt install llvm
        echo CXX=clang++ >> "$GITHUB_ENV"
        echo AR=llvm-ar >> "$GITHUB_ENV"

    - name: Ubuntu-specific setup
      if:  ${{ contains(matrix.os, 'ubuntu') }}
      run: |
        sudo apt install libb2-dev \
          libbz2-dev \
          libffi-dev \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libncurses5-dev \
          libreadline6-dev \
          libsqlite3-dev \
          libssl-dev \
          libzstd-dev \
          lzma-dev \
          strace \
          tk-dev \
          uuid-dev \
          zlib1g-dev
        MPDECIMAL_VERSION=4.0.1
        curl -fsSL "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-${MPDECIMAL_VERSION}.tar.gz" \
            | tar -xz -C /tmp
        (cd "/tmp/mpdecimal-${MPDECIMAL_VERSION}" \
            && ./configure --prefix=/usr/local \
            && make -j \
            && sudo make install)
        sudo ldconfig
        echo TESTPYTHON=python >> "$GITHUB_ENV"

    - name: Configure no-GIL with HWAddress, memtag-stack, LSan, UBSan, Type Sanitizer, MSan
      run: |
          ./configure \
             ${{ contains(matrix.os, 'macos') && '--with-openssl="$(brew --prefix openssl@3.5)"' || '' }} \
            --with-undefined-behavior-sanitizer \
            --with-thread-sanitizer \
            --with-pydebug \
            --disable-gil \
            --enable-safety \
            --enable-slower-safety \
            --with-lto=yes \
            --config-cache \
            --with-strict-overflow

    - name: Upload config.log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config-log
        path: 'config.log'

    - name: Build then display build info
      if: success() || failure()
      run: make -j pythoninfo

    - name: Tests
      if: success() || failure()
      run: |
        ./$TESTPYTHON -m test -x test_capi -x test_faulthandler
        ./$TESTPYTHON -m test --tsan-parallel --parallel-threads=6 -j6
        make -j ci

    - name: Display logs
      if: always()
      run: find "${GITHUB_WORKSPACE}" -name 'san_log.*' | xargs head -n 1000

    - name: Upload San logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        path: san_log.*
        if-no-files-found: ignore
