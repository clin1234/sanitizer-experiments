name: Makefile CI

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:
  push:

jobs:
  build-macos:
    runs-on: macos-26
    env:
      # -fsanitize=memtag-stack -march=armv8a+memtag only with M5 CPU
      CFLAGS: '-fsanitize-address-use-after-scope -fsanitize-coverage=trace-cmp -fstack-clash-protection'
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      MACOSX_DEPLOYMENT_TARGET: 10.15
      LDFLAGS: "-L/opt/homebrew/opt/llvm/lib"
      CPPFLAGS: "-I/opt/homebrew/opt/llvm/include"

    steps:
    - uses: actions/checkout@v6
      with:
        repository: "python/cpython"

    - name: Install Homebrew dependencies
      run: |
        brew bundle --file=Misc/Brewfile
        brew install make llvm
        export PATH="/opt/homebrew/opt/llvm/bin:$PATH"

    - name: System info
      run: |
        clang --version
        system_profiler SPHardwareDataType

    - name: Configure no-GIL with HWAddress, memtag-stack, LSan, UBSan, Type Sanitizer, MSan
      run: |
          ./configure \
            --with-undefined-behavior-sanitizer \
            --with-pydebug \
            --disable-gil \
            --enable-safety \
            --enable-slower-safety \
            --with-lto=yes \
            --config-cache \
            --prefix=/opt/python-dev \
            --disable-ipv6

    - name: Upload config.log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config-log
        path: 'config.log'
  
    - name: Make
      run: gmake -j

    - name: Display build info
      run: gmake pythoninfo

    - name: Tests
      run: gmake ci
          
