name: Makefile CI

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:
  push:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CC: 'clang'
      CFLAGS: |
        -fsanitize=hwaddress -fsanitize=memtag-stack -fsanitize=undefined
        -fsanitize-address-use-after-scope -fsanitize-coverage=trace-cmp
        -fstack-check -fstack-clash-protection -fsanitize=safe-stack
        -fsanitize=alloc-token -fsanitize=dataflow -fsanitize=memory
        -march=armv8a+memtag -fsanitize-cfi-cross-dso 
        -fsanitize-cfi-icall-generalize-pointers

    steps:
    - uses: actions/checkout@v6
      with:
        repository: "python/cpython"

    - name: Configure no-GIL with HWAddress, memtag-stack, LSan, UBSan, Type Sanitizer, MSan
      run: |
          ./configure \
            --with-undefined-behavior-sanitizer
            --disable-gil
            --enable-safety
            --config-cache
            --with-lto=yes

    - name: Upload config.log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config-log
        path: 'config.log'
  
    - name: Make
      run: make -j8 --output-sync

    - name: Display build info
      run: make pythoninfo

    - name: Tests
      run: make ci
          
