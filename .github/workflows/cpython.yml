name: Main Python with Sans

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        cc: [clang, gcc]
        os: [ubuntu-latest, windows-latest, macos-26, macos26-intel]
    runs-on: ${{ matrix.os }}
    env:
      # -fsanitize=memtag-stack -march=armv8a+memtag only with M5 CPU
      # CFLAGS: '-fsanitize-address-use-after-scope -fsanitize-coverage=trace-cmp -fstack-clash-protection'
      PYTHONSTRICTEXTENSIONBUILD: 1
      CC: ${{ matrix.cc }}
      # LDFLAGS: "-L/opt/homebrew/opt/llvm/lib"
      # CPPFLAGS: "-I/opt/homebrew/opt/llvm/include"

    steps:
    - uses: actions/checkout@v6
      with:
        repository: "python/cpython"

    - name: Install Homebrew dependencies
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew bundle --file=Misc/Brewfile
        brew install make llvm
        echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> "$GITHUB_ENV"
        alias make=gmake
#        export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
#        ls /opt/homebrew/opt/llvm/bin
#        env

#    - name: System info
#      run: |
#        $CC --version
#        system_profiler SPHardwareDataType

    - name: Export macOS-specific ENVs
      if:  ${{ contains(matrix.os, 'macos') }}
      run: |
         echo GDBM_CFLAGS="-I$(brew --prefix gdbm)/include" >> "$GITHUB_ENV"
         echo GDBM_LIBS="-L$(brew --prefix gdbm)/lib -lgdbm" >> "$GITHUB_ENV"

    - name: Export Ubuntu-specific ENVs on LLVM
      if:  ${{ contains(matrix.os, 'ubuntu') && matrix.cc == 'clang'}}
      run: |
         echo AR=llvm-ar >> "$GITHUB_ENV"

    - name: Configure no-GIL with HWAddress, memtag-stack, LSan, UBSan, Type Sanitizer, MSan
      run: |
          ./configure \
            --with-undefined-behavior-sanitizer \
            --with-pydebug \
            --disable-gil \
            --enable-safety \
            --enable-slower-safety \
            --with-lto=yes \
            --config-cache

    - name: Upload config.log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config-log
        path: 'config.log'
  
    - name: Make
      run: make -j

    - name: Display build info
      run: make pythoninfo

    - name: Tests
      run: make ci
          
